<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Interface</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
        }
        .chat-container {
            width: 300px;
            height: 400px;
            background: #222;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
            overflow: hidden;
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, height 0.3s ease, right 0.3s ease;
            color: white;
        }
        .collapsed {
            height: 50px;
        }
        .expanded {
            right: 340px;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #b30000;
            color: white;
            position: relative;
        }
        .top-bar button {
            background: black;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 5px;
            color: white;
        }
        .minimize {
            background: darkred;
            color: white;
            border: none;
            padding: 5px;
            cursor: pointer;
            border-radius: 50%;
        }
        .maximize {
            display: none;
            background: green;
            color: white;
            border: none;
            padding: 5px;
            cursor: pointer;
            border-radius: 50%;
        }
        .chat-window {
            flex-grow: 1;
            padding: 10px;
            overflow-y: auto;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: height 0.3s ease;
        }
        .collapsed .chat-window, .collapsed .input-box {
            display: none;
        }
        .collapsed .maximize {
            display: inline;
        }
        .expander {
            position: absolute;
            top: 10px;
            right: 10px;
            cursor: pointer;
            background: darkred;
            color: white;
            padding: 5px;
            border-radius: 50%;
            font-weight: bold;
        }
        .input-box {
            display: flex;
            padding: 10px;
            background: #333;
            align-items: center;
        }
        .input-box input {
            flex-grow: 1;
            padding: 5px;
            border: 1px solid #555;
            border-radius: 5px;
            height: 30px;
            background: black;
            color: white;
        }
        .input-box button {
            padding: 5px 10px;
            background: darkred;
            color: white;
            border: none;
            cursor: pointer;
            margin-left: 5px;
            border-radius: 5px;
            height: 34px;
        }
        .right-pane {
            width: 300px;
            height: 400px;
            position: fixed;
            bottom: 20px;
            right: -320px;
            background: #222;
            box-shadow: -2px 0 5px rgba(255, 0, 0, 0.5);
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .expanded + .right-pane {
            right: 20px;
        }
        .top-bar .controls {
            display: flex;
            gap: 5px;
        }
        .chat-message {
            padding: 8px;
            margin: 5px;
            border-radius: 10px;
            max-width: 80%;
            word-wrap: break-word;
        }
        .user-message {
            background: #b30000;
            align-self: flex-end;
            color: white;
        }
        .bot-message {
            background: #333;
            align-self: flex-start;
            color: white;
        }
    </style>
</head>
<body>
    <div class="chat-container" id="chatContainer">
        <div class="top-bar">
            <button>Preprofile Search</button>
            <div class="controls">
                <button>Onboarding</button>
                <button class="minimize" onclick="toggleChat()">–</button>
                <button class="maximize" onclick="toggleChat()">⬆</button>
            </div>
        </div>
        <div class="chat-window" id="chatWindow">
            <span class="expander" onclick="togglePane()">&#9654;</span>
        </div>
        <div class="input-box">
            <input type="text" id="userInput" placeholder="Type a message..." onkeypress="return searchKeyPress(event);" >
            <button id="btnSearch" onclick="sendMessage()">Send</button>
        </div>
    </div>
    <div class="right-pane" id="rightPane">
        <p>Extra Content</p>
    </div>
    
    <script>
		function searchKeyPress(e)
		{
			// look for window.event in case event isn't passed in
			e = e || window.event;
			if (e.keyCode == 13)
			{
				document.getElementById('btnSearch').click();
				return false;
			}
			return true;
		}
        function togglePane() {
            let chat = document.getElementById("chatContainer");
            let rightPane = document.getElementById("rightPane");
            chat.style.right = rightPane.classList.contains("expanded") ? "20px" : "340px";
            rightPane.style.right = rightPane.classList.contains("expanded") ? "-320px" : "20px";
            rightPane.classList.toggle("expanded");
        }
        function toggleChat() {
            let chat = document.getElementById("chatContainer");
            chat.classList.toggle("collapsed");
        }
		
		function sendMessage() {
            let inputField = document.getElementById("userInput");
            let chatWindow = document.getElementById("chatWindow");
            let message = inputField.value.trim();
            if (message === "") return;
            
            let userMessage = document.createElement("div");
            userMessage.className = "chat-message user-message";
            userMessage.innerText = message;
            chatWindow.appendChild(userMessage);
            inputField.value = "";
            chatWindow.scrollTop = chatWindow.scrollHeight;
            
            fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: message })
            })
            .then(response => response.json())
            .then(data => {
                let botMessage = document.createElement("div");
                botMessage.className = "chat-message bot-message";
                botMessage.innerText = data.response;
                chatWindow.appendChild(botMessage);
                chatWindow.scrollTop = chatWindow.scrollHeight;
            });
        }
		function handleKeyPress(event) {
            
			sendMessage();
            
        }
    </script>
</body>
</html>
